<!DOCTYPE html> 
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            body { 
                width: 250px; 
                padding: 15px; 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                text-align: center;
                background-color: #f8f9fa;
            }
            .btn {
                padding: 10px 15px; 
                cursor: pointer; 
                color: white; 
                border: none; 
                border-radius: 5px;
                font-weight: bold;
                width: 100%;
                margin-bottom: 8px;
                transition: background 0.3s;
            }
            #extractBtn { background: #28a745; }
            #extractBtn:hover { background: #218838; }
            
            #stopBtn { background: #dc3545; }
            #stopBtn:hover { background: #c82333; }
            
            #statusText { margin-top: 10px; font-size: 12px; color: #6c757d; font-weight: bold; }
        </style>
    </head>
    <body>
        <h3>Prop Radar</h3>
        <button id="extractBtn" class="btn">Start Extraction</button>
        <button id="stopBtn" class="btn">Stop Extraction</button>
        <div id="statusText">Waiting for action...</div>
        <script src="popup.js"></script>
    </body>
</html>
